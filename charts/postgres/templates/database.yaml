apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-bootstrap
  namespace: {{ .Values.namespace }}
data:
  10-pestilence.sh: |
    #!/bin/sh
    set -eu
    psql --username "$POSTGRES_USER" --dbname postgres --set ON_ERROR_STOP=1 <<'SQL'
    \getenv app_password PESTILENCE_DB_PASSWORD
    CREATE ROLE pestilence LOGIN PASSWORD :'app_password';
    CREATE DATABASE pestilence OWNER pestilence;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app.kubernetes.io/name: platform-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/var/run/postgres-tls/tls.crt
            - -c
            - ssl_key_file=/var/run/postgres-tls/tls.key
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: platform_admin
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: admin-password
            - name: PESTILENCE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentialsSecret }}
                  key: pestilence-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: [pg_isready, -U, platform_admin, -d, postgres]
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, platform_admin, -d, postgres]
            initialDelaySeconds: 30
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: socket
              mountPath: /var/run/postgresql
            - name: bootstrap
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: tls
              mountPath: /var/run/postgres-tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: socket
          emptyDir: {}
        - name: bootstrap
          configMap:
            name: postgres-bootstrap
            defaultMode: 365
        - name: tls
          secret:
            secretName: postgres-server-tls
            defaultMode: 288
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ .Values.storageSize }}
